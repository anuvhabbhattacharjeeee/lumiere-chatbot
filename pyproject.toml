[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumiere-chatbot"
version = "0.1.0"
description = "A polished, streaming Streamlit chatbot powered by OpenRouter."
requires-python = ">=3.10"
dependencies = [
	"streamlit>=1.38.0",
	"langchain-core>=0.3.0",
	"langchain-openai>=0.2.0",
	"python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["config*", "lumiere*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
